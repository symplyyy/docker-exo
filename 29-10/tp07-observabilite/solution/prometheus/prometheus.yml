global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 3000

  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
