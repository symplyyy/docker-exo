name: shop

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.6.2
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=shop_front
      - --entrypoints.web.address=:80
      - --ping=true
      - --accesslog=true
      - --providers.providersThrottleDuration=500ms
      - --serverstransport.forwardingtimeouts.dialtimeout=500ms
      - --serverstransport.maxidleconnsperhost=-1
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - front
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    logging: *logging
    restart: unless-stopped

  api:
    build: ./apps/shopapi
    image: shopapi:local
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export DATABASE_URL="postgres://shop:$$(cat /run/secrets/db_password)@db:5432/shop" &&
        exec node src/server.js
    environment:
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    secrets:
      - db_password
    networks:
      - front
      - back
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/ready"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.localhost`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=3000
      - traefik.http.services.api.loadbalancer.healthcheck.path=/health
      - traefik.http.services.api.loadbalancer.healthcheck.interval=5s
      - traefik.http.middlewares.api-retry.retry.attempts=5
      - traefik.http.middlewares.api-retry.retry.initialinterval=50ms
      - traefik.http.routers.api.middlewares=api-retry
    logging: *logging
    restart: unless-stopped

  worker:
    build:
      context: ./apps/shop-worker
      secrets:
        - pipconf
    image: shop-worker:local
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export DATABASE_URL="postgres://shop:$$(cat /run/secrets/db_password)@db:5432/shop" &&
        exec python -m worker.main
    environment:
      REDIS_URL: redis://redis:6379
    secrets:
      - db_password
    networks:
      - back
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)"]
    logging: *logging
    restart: unless-stopped

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - back
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - back
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]
    logging: *logging
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - front
      - back
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080') ? 0 : 1);"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.adminer.rule=Host(`adminer.localhost`)
      - traefik.http.routers.adminer.entrypoints=web
      - traefik.http.services.adminer.loadbalancer.server.port=8080
    logging: *logging

  migrate:
    image: postgres:16.4-alpine
    profiles: [ops]
    environment:
      MIGRATION: ${MIGRATION:-}
    command:
      - sh
      - -c
      - >-
        test -n "$$MIGRATION" || { echo "MIGRATION manquant"; exit 1; } &&
        PGPASSWORD="$$(cat /run/secrets/db_password)"
        psql -h db -U shop -d shop -v ON_ERROR_STOP=1 -f "/migrations/$$MIGRATION"
    secrets:
      - db_password
    volumes:
      - ./db/migrations:/migrations:ro
    networks:
      - back
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

networks:
  front:
  back:
    internal: true

volumes:
  pgdata:
  redisdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  pipconf:
    file: ./apps/shop-worker/pip.conf
