worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  map $upstream_http_docker_distribution_api_version $docker_distribution_api_version {
    '' 'registry/2.0';
  }

  map "$remote_user:$request_method" $rbac_denied {
    default              1;
    "~^:"                0;
    "~^ci:"              0;
    "~^dev:(GET|HEAD)$"  0;
  }

  upstream registry {
    server registry:5000;
  }

  server {
    listen 5000 ssl;
    server_name registry.local localhost;

    ssl_certificate     /etc/nginx/certs/registry.crt;
    ssl_certificate_key /etc/nginx/certs/registry.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 0;
    chunked_transfer_encoding on;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    location /v2/ {
      if ($rbac_denied) {
        add_header Content-Type application/json always;
        return 403 '{"errors":[{"code":"DENIED","message":"ce compte est en lecture seule"}]}';
      }
      add_header Docker-Distribution-Api-Version $docker_distribution_api_version always;

      proxy_pass                http://registry;
      proxy_set_header          Host              $http_host;
      proxy_set_header          X-Real-IP         $remote_addr;
      proxy_set_header          X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header          X-Forwarded-Proto $scheme;
      proxy_read_timeout        900;
      proxy_request_buffering   off;
    }
  }
}
